  <script>
    // Sticky nav on scroll
    const stickyNav = document.getElementById('stickyNav');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 75) {
        stickyNav.classList.add('visible');
      } else {
        stickyNav.classList.remove('visible');
      }
    });
  </script>
  <script>
    // Sticky nav mobile menu toggle
    const stickyToggle = document.getElementById('stickyMobileToggle');
    const stickyNavMenu = document.getElementById('stickyMainNav');

    if (stickyToggle && stickyNavMenu) {
      stickyToggle.addEventListener('click', () => {
        stickyNavMenu.classList.toggle('open');
      });

      // Close menu when a link is clicked
      stickyNavMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          stickyNavMenu.classList.remove('open');
        });
      });
    }
  </script>
</body>
